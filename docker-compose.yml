services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bayaan
      POSTGRES_PASSWORD: bayaan
      POSTGRES_DB: bayaan
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bayaan -d bayaan"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      # Override this in a real deployment — the app refuses to start in
      # production with the default key.
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me-before-deploying}
      DATABASE_URL: postgresql+psycopg://bayaan:bayaan@db:5432/bayaan
      CORS_ORIGINS: http://localhost:8000
      ALLOWED_HOSTS: localhost,127.0.0.1
      # Point these at a real model to leave inspector mode.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      CLOUD_BASE_URL: ${CLOUD_BASE_URL:-}
      CLOUD_API_KEY: ${CLOUD_API_KEY:-}
    ports:
      - "8000:8000"

volumes:
  pgdata:
